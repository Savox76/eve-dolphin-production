<svg xmlns="http://www.w3.org/2000/svg" width="840" height="900" viewBox="0 0 840 900" role="img" aria-labelledby="title desc">
  <title id="title">Mobile Wireframes für Übersicht und Projektdetail</title>
  <desc id="desc">Zwei mobile Ansichten mit priorisierten Aktionen, gestapelten Inhalten und Bottom Navigation.</desc>
  <defs><style>
    .outer{fill:#050b14}.phone{fill:#08111f;stroke:#31445f;stroke-width:2}.surface{fill:#111f33}.surface2{fill:#16263c}.line{stroke:#31445f;stroke-width:1}.text{fill:#f3f7fb;font-family:Inter,Arial,sans-serif}.buttonText{fill:#08111f;font-family:Inter,Arial,sans-serif}.muted{fill:#9aacbf;font-family:Inter,Arial,sans-serif}.accent{fill:#38bdf8}.good{fill:#34d399}.warn{fill:#fbbf24}.estimate{fill:#c084fc}.manual{fill:#60a5fa}.blocked{fill:#fb7185}.h1{font-size:21px;font-weight:600}.h2{font-size:15px;font-weight:600}.body{font-size:13px}.small{font-size:11px}.nav{font-size:10px}.num{font-size:20px;font-weight:600}
  </style></defs>
  <rect class="outer" width="840" height="900"/>

  <g aria-label="Mobile Übersicht">
    <rect class="phone" x="20" y="20" width="390" height="844" rx="28"/>
    <text class="text h2" x="44" y="60">EVE Production Tool</text><circle class="good" cx="330" cy="55" r="5"/><text class="muted small" x="342" y="59">3 Min.</text>
    <line class="line" x1="40" y1="76" x2="390" y2="76"/>
    <text class="text h1" x="44" y="112">Übersicht</text><rect class="accent" x="252" y="88" width="138" height="38" rx="8"/><text class="buttonText body" x="274" y="112">+ Neues Projekt</text>

    <rect x="40" y="144" width="350" height="68" rx="8" fill="#321c25"/><circle class="blocked" cx="60" cy="168" r="6"/><text class="text body" x="76" y="172">1 Projekt blockiert</text><text class="muted small" x="60" y="194">J151141 · Exportweg fehlt</text><text class="accent small" x="332" y="194">Öffnen</text>

    <text class="text h2" x="44" y="246">Nächste Aktionen</text>
    <rect class="surface" x="40" y="262" width="350" height="74" rx="8"/><circle class="warn" cx="60" cy="285" r="5"/><text class="text body" x="76" y="289">Extractor endet in 7 h</text><text class="muted small" x="60" y="316">PI-Alt-A · Oceanic I</text><text class="accent small" x="330" y="316">Planen</text>
    <rect class="surface" x="40" y="346" width="350" height="74" rx="8"/><circle class="manual" cx="60" cy="369" r="5"/><text class="text body" x="76" y="373">Steuerprofil prüfen</text><text class="muted small" x="60" y="400">Industry-Structure-A · manuell</text><text class="accent small" x="334" y="400">Prüfen</text>

    <text class="text h2" x="44" y="458">Aktive Projekte</text>
    <rect class="surface" x="40" y="474" width="350" height="98" rx="8"/><text class="text body" x="60" y="500">10 × Caracal</text><text class="good body" x="278" y="500">+18,4 Mio.</text><rect class="surface2" x="60" y="520" width="310" height="9" rx="5"/><rect class="accent" x="60" y="520" width="217" height="9" rx="5"/><text class="muted small" x="60" y="552">70 % · Fertig heute 21:40</text>
    <rect class="surface" x="40" y="582" width="350" height="98" rx="8"/><text class="text body" x="60" y="608">5.000 × Robotics</text><text class="estimate body" x="278" y="608">Geschätzt</text><rect class="surface2" x="60" y="628" width="310" height="9" rx="5"/><rect class="estimate" x="60" y="628" width="124" height="9" rx="5"/><text class="muted small" x="60" y="660">40 % · Fertig in 12 Tagen</text>

    <text class="muted small" x="44" y="720">Datenzustände: Aktuell · Veraltet · Geschätzt · Manuell</text>
    <rect class="surface2" x="40" y="778" width="350" height="64" rx="14"/>
    <circle class="accent" cx="82" cy="800" r="5"/><text class="text nav" x="58" y="824">Übersicht</text>
    <circle class="muted" cx="166" cy="800" r="5"/><text class="muted nav" x="159" y="824">PI</text>
    <circle class="muted" cx="250" cy="800" r="5"/><text class="muted nav" x="230" y="824">Projekte</text>
    <circle class="muted" cx="346" cy="800" r="5"/><text class="muted nav" x="334" y="824">Mehr</text>
  </g>

  <g aria-label="Mobiles Projektdetail">
    <rect class="phone" x="430" y="20" width="390" height="844" rx="28"/>
    <text class="muted body" x="454" y="58">‹ Projekte</text><circle class="good" cx="752" cy="54" r="5"/><text class="muted small" x="764" y="58">Gespeichert</text><line class="line" x1="450" y1="76" x2="800" y2="76"/>
    <text class="text h1" x="454" y="110">10 × Caracal</text><text class="muted small" x="454" y="132">Main-Char · Industry-Structure-A</text>
    <rect x="450" y="150" width="350" height="54" rx="8" fill="#322b16"/><circle class="warn" cx="470" cy="177" r="5"/><text class="text body" x="486" y="174">Marktdaten veraltet</text><text class="accent small" x="718" y="181">Aktualisieren</text>

    <g aria-label="Mobile Projekttabs"><text class="accent small" x="454" y="234">Übersicht</text><text class="muted small" x="532" y="234">Material</text><text class="muted small" x="602" y="234">Plan</text><text class="muted small" x="648" y="234">Kosten</text><text class="muted small" x="712" y="234">Logistik</text><line x1="454" y1="244" x2="512" y2="244" stroke="#38bdf8" stroke-width="3"/></g>

    <rect class="surface" x="450" y="264" width="350" height="126" rx="8"/><text class="muted small" x="470" y="290">NETTOGEWINN</text><text class="good num" x="470" y="326">18,4 Mio. ISK</text><text class="warn small" x="470" y="348">Veraltet · Marge 9,1 %</text><line class="line" x1="470" y1="362" x2="780" y2="362"/><text class="text body" x="470" y="382">Machbar · fertig morgen 21:40</text>

    <text class="text h2" x="454" y="428">Nächster Schritt</text><rect class="surface" x="450" y="444" width="350" height="82" rx="8"/><text class="text body" x="470" y="470">Fehlende Mineralien kaufen</text><text class="muted small" x="470" y="492">184 Mio. ISK · Jita Sell Orders</text><text class="accent body" x="708" y="496">Einkauf →</text>

    <text class="text h2" x="454" y="562">Materialengpässe</text><rect class="surface" x="450" y="578" width="350" height="124" rx="8"/><text class="text body" x="470" y="606">Tritanium</text><text class="muted small" x="680" y="606">1,2 Mio. fehlen</text><text class="accent small" x="470" y="628">Bestand + Kaufen · ändern</text><line class="line" x1="470" y1="646" x2="780" y2="646"/><text class="text body" x="470" y="676">Isogen</text><text class="warn small" x="700" y="676">Veraltet</text><text class="accent small" x="470" y="696">Kaufen · ändern</text>

    <rect class="accent" x="450" y="722" width="350" height="44" rx="8"/><text class="buttonText body" x="582" y="750">Plan starten</text>
    <rect class="surface2" x="450" y="778" width="350" height="64" rx="14"/>
    <circle class="muted" cx="492" cy="800" r="5"/><text class="muted nav" x="468" y="824">Übersicht</text><circle class="muted" cx="576" cy="800" r="5"/><text class="muted nav" x="569" y="824">PI</text><circle class="accent" cx="660" cy="800" r="5"/><text class="text nav" x="640" y="824">Projekte</text><circle class="muted" cx="756" cy="800" r="5"/><text class="muted nav" x="744" y="824">Mehr</text>
  </g>
</svg>
