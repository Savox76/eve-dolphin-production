  <rect x="294" y="222" width="1114" height="54" rx="8" fill="#322b16"/><circle class="warn" cx="318" cy="249" r="6"/><text class="text body" x="336" y="246">Marktdaten sind 48 Minuten alt.</text><text class="muted small" x="336" y="264">Plan bleibt sichtbar, Gewinn erhält Status „Veraltet“.</text><text class="accent small" x="1310" y="254">Aktualisieren</text>

