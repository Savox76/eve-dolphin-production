  <text class="muted body" x="1050" y="410">Jobkosten</text><text class="text body" x="1280" y="410">4,6 Mio.</text>
  <text class="muted body" x="1050" y="450">Logistik</text><text class="manual body" x="1280" y="450">2,1 Mio.</text>
  <text class="muted body" x="1050" y="490">Marktgebühren</text><text class="text body" x="1280" y="490">14,9 Mio.</text>
  <line class="line" x1="1050" y1="514" x2="1384" y2="514"/><text class="muted body" x="1050" y="548">Nettoerlös</text><text class="text body" x="1280" y="548">202,0 Mio.</text>
  <text class="text h2" x="1050" y="594">Nettogewinn</text><text class="good num" x="1244" y="594">18,4 Mio.</text><text class="warn small" x="1050" y="618">Veraltet · Jita Orders vor 48 Min.</text>

  <rect class="surface" x="294" y="656" width="1114" height="190" rx="10"/><text class="text h2" x="318" y="688">Kritischer Pfad</text><text class="muted small" x="318" y="714">Material kaufen</text><text class="muted small" x="585" y="714">Transport</text><text class="muted small" x="814" y="714">Manufacturing</text><text class="muted small" x="1158" y="714">Verkauf</text>
  <line x1="332" y1="760" x2="1364" y2="760" stroke="#31445f" stroke-width="8" stroke-linecap="round"/>
  <line x1="332" y1="760" x2="544" y2="760" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/><circle class="accent" cx="332" cy="760" r="10"/><circle class="manual" cx="585" cy="760" r="10"/><circle class="estimate" cx="814" cy="760" r="10"/><circle class="good" cx="1158" cy="760" r="10"/><circle class="muted" cx="1364" cy="760" r="10"/>
  <text class="text body" x="318" y="808">Heute 18:00</text><text class="text body" x="772" y="808">Job: 10 h 34 min</text><text class="text body" x="1250" y="808">Morgen 21:40</text>
