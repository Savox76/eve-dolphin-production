  <line class="line" x1="318" y1="526" x2="984" y2="526"/><text class="text body" x="318" y="560">Isogen</text><text class="text body" x="610" y="560">74.500</text><text class="text body" x="712" y="560">Kaufen</text><circle class="warn" cx="896" cy="555" r="5"/><text class="muted small" x="908" y="560">Veraltet</text>
