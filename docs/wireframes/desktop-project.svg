  <line class="line" x1="318" y1="422" x2="984" y2="422"/><text class="text body" x="318" y="456">Pyerite</text><text class="text body" x="610" y="456">817.300</text><text class="text body" x="712" y="456">Kaufen</text><circle class="good" cx="896" cy="451" r="5"/><text class="muted small" x="908" y="456">Aktuell</text>
